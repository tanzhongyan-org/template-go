version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - errorlint
    - noctx
    - sqlclosecheck
    - dupl
  settings:
    dupl:
      threshold: 100
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

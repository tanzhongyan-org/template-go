name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: tanzhongyan-org/.github/.github/workflows/codeql.yml@770874f61526508deac7a5713e408079ba016d62 # v1
    with:
      runtime: go
      language: go
      build-mode: autobuild

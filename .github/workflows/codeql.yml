name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: tanzhongyan-org/.github/.github/workflows/codeql.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # shared CI pin, updated by Renovate
    with:
      runtime: go
      language: go
      build-mode: autobuild

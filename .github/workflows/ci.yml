name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: tanzhongyan-org/.github/.github/workflows/ci.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # shared CI pin, updated by Renovate
    with:
      runtime: go
      postgres-db: template_go
      database-url: postgres://postgres:password@localhost:5432/template_go?sslmode=disable
      install-command: go mod download

  # Local aggregator: reusable jobs report as "ci / <job>", but the org
  # ruleset requires a check literally named "ci-passed". This job mirrors
  # the shared workflow's result under that stable name.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the shared CI to succeed or be skipped
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "Shared CI finished with: $RESULT"
            exit 1
          fi

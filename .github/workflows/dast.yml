name: DAST

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: template_go
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start the server
        run: |
          make build
          ./bin/server > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sSf http://localhost:8080/health >/dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/template_go?sslmode=disable
          TRUST_IDENTITY_HEADER: "true"

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report
          cmd_options: >-
            -z "-config replacer.full_list(0).description=identity
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstring=x-user-id
            -config replacer.full_list(0).replacement=zap-scanner"

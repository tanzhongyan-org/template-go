name: DAST

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    uses: tanzhongyan-org/.github/.github/workflows/dast.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # shared CI pin, updated by Renovate
    with:
      runtime: go
      tool: zap
      postgres-db: template_go
      database-url: postgres://postgres:password@localhost:5432/template_go?sslmode=disable
      base-url: http://localhost:8080
      health-url: http://localhost:8080/health
      install-command: go mod download
      build-command: make build
      start-command: ./bin/server
      # No identity replacer: replacer.full_list(0) with REQ_HEADER injects a
      # malformed empty-name ": <value>" header under ZAP 2.17.0 (packet
      # captured on the T3 template), and strict parsers answer every request
      # 400. The baseline therefore scans the public surface.
